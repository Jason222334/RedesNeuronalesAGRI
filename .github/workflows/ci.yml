name: CI — Sistema Inteligente Agrícola

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint y tests del Backend Python
  # ─────────────────────────────────────────────
  backend-check:
    name: Backend (Python FastAPI)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Instalar dependencias
        working-directory: backend
        run: |
          pip install --upgrade pip
          # Instalar sin TensorFlow en CI (demasiado pesado)
          grep -v tensorflow requirements.txt | grep -v keras > requirements_ci.txt
          pip install -r requirements_ci.txt
      
      - name: Verificar imports críticos
        working-directory: backend
        run: |
          python -c "import fastapi, sqlalchemy, pandas, sklearn, statsmodels, xgboost, scipy, matplotlib, seaborn, reportlab, docx; print('✅ Todos los imports OK')"
      
      - name: Verificar sintaxis del backend
        working-directory: backend
        run: |
          python -m py_compile main.py
          python -m py_compile models_db.py
          python -m py_compile database.py
          python -m py_compile routers/ia_analysis.py
          python -m py_compile ml_model/eda.py
          python -m py_compile ml_model/statistical_tests.py
          echo "✅ Sintaxis de archivos backend verificada"

  # ─────────────────────────────────────────────
  # JOB 2: Build del Frontend React
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend (React)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      
      - name: Build de producción
        working-directory: frontend
        run: npm run build
        env:
          CI: false  # Evitar que warnings rompan el build
          REACT_APP_API_URL: https://agrojequete-backend.onrender.com
          REACT_APP_STREAMLIT_URL: https://agrojequete-streamlit.onrender.com
      
      - name: Verificar build exitoso
        run: |
          ls -la frontend/build/
          echo "✅ Build de React completado"
